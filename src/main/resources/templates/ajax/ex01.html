<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>

	<h2>AJAX 테스트</h2>
	
	
	
	<label>이름 : </label><input type="text" id="nameInput">
	<label>생년월일 : </label><input type="text" id="birthdayInput">
	<button type="button" id="ajaxBtn">AJAX</button>
	
	<div>이름 : <span id="nameSpan"></span></div>
	<div>나이 : <span id="ageSpan"></span></div>
	

<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
<script>
	$(document).ready(function() {

		$("#ajaxBtn").on("click",function() {
			let name = $("#nameInput").val();
			let birthday = $("#birthdayInput").val();
			// /ajax/person
			// 이름과 생년월일을 전달해서 , 이름과 나이를 전달받는다.
			$.ajax({
				type:"get"
				,url:"/ajax/person"
				,data:{"name":name, "birthday":birthday}
				//response : 응답으로 돌아온 데이터를 저장해서 받기위해
				,success:function(response) {
					// response 가 정상적으로 전달되었을때 수행될 함수
					// jqeury ajax 함수
					// response 로 전달된 결과는 json 문자열
					// 문자열로 전달된 json 데이터를
					// javascript 객체로 변환해준다. ajax함수가! .name이 안되겠지 문자열이면
					// {"name":"유재석", "age":"21"} 이런 문자열을 객체로 바꿔줌
					console.log(response.name);
					
					$("#nameSpan").text(response.name);
					$("#ageSpan").text(response.age);
				}
			});
			
		});
		
	});
</script>

</body>
</html>
