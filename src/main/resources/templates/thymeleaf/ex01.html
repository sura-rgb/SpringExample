<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Thymeleaf 변수와 조건문</title>
</head>
<body>
	<h3>Thymeleaf 변수와 조건문</h3>
	
	<h3>1. 변수</h3>
	<!-- 지역변수느낌 태그안에서만 사용가능 -->
	<div th:with="number = 100">
		<h4 th:text="${number}"></h4>
		<h4> [[${number}]]</h4> <!-- 지양할것 -->
	</div>
	<!-- 변수가 선언된 태그 하위에서만 사용가능 -->
	<h4 th:text="${number}"></h4>
	
	<h3>2. 태그없이 thymeleaf 활용하기</h3>
	<!-- block 태그는 최종 결과에 포함되지않는다.
		block 태그는 렌더링 되지 않는다. -->
	<th:block th:with="number1 = 200, number2 = 300">
		<h4 th:text="${number1}"></h4>
		<h4 th:text="${number1 + number2}"></h4>
		<!--  결과 : 500 -->
		<h4 th:text="'결과 : ' + ${number1 + number2}"></h4>
		<h4>결과 : [[${number1 + number2}]]</h4> <!-- 지양 -->
		<h4 th:text="|결과 : ${number1 + number2}|"></h4>
	</th:block>
	
	<h3>3.태그 나타내기</h3>
	<!-- html escape 처리 -->
	<div th:text="'<b>진한글씨</b>'"></div>
	<div th:utext="'<b>진한글씨</b>'"></div>

	<h4>4. 조건문</h4>
	<th:block th:with="age=18">
		<h4 th:if="ture">true일때만 태그가 포함(랜더링) 된다</h4>
		<h4 th:if="${age < 20}">미성년자 입니다.</h4>
		<h4 th:if="${age >= 20}">나이가 20살 이상이다</h4>
		<h4 th:if="${age < 30}">30살 미만이다</h4>
		<h4 th:if="${age == 23}">나이가 23살 이다</h4>
		<!-- unless - 부정  , if에 대한 조건의 반대, 굳이 쓸필요 있나-->
		<h4 th:if="${age >= 20}">성인입니다</h4>
		<h4 th:unless="${age >= 20}">미성년 입니다.</h4>
		
		<h4>4. Switch 문</h4>
		<!--  몸 따듯하다, 여름 덥다, 가을 시원하다, 겨울 춥다 -->
		<th:block th:with="season = 'ㄹ'">
			<div th:switch="${season}">
				<h4 th:case="봄">따듯하다</h4>
				<h4 th:case="여름">덥다</h4>
				<h4 th:case="가을">시원하다</h4>
				<h4 th:case="겨울">춥다</h4>
				<h4 th:case="*">잘못된 계절이름 입니다.</h4>
			</div>
			
		</th:block>
</body>
</html>
